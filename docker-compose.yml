services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: customer_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/customer_intelligence
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
